<svg xmlns="http://www.w3.org/2000/svg" width="960" height="910" viewBox="0 0 960 910" role="img" aria-labelledby="title desc"><title id="title">Our video experiment map</title><desc id="desc">Eight areas tested. Some checks worked, many still need work. Code builds editable scenes; joint action keeps bodies together; composition combines pieces. Choose per shot.</desc><rect width="960" height="910" rx="20" fill="#f3f5f8"/><g font-family="Arial,sans-serif" fill="#16243c"><text x="32" y="46" font-size="27" font-weight="700">Build a movie like a storybook</text><text x="32" y="76" font-size="17">41 grouped trials • 8 areas • findings, not a production score</text><rect x="32" y="103" width="290" height="100" rx="14" fill="#dbebff"/><text x="48" y="136" font-size="18" font-weight="700">BUILD IT</text><text x="48" y="173" font-size="15">Code owns the stage and moves.</text><rect x="334" y="103" width="290" height="100" rx="14" fill="#fce6cc"/><text x="350" y="136" font-size="18" font-weight="700">MAKE ACTION TOGETHER</text><text x="350" y="173" font-size="15">Hands and props share one act.</text><rect x="636" y="103" width="290" height="100" rx="14" fill="#dceee5"/><text x="652" y="136" font-size="18" font-weight="700">COMBINE PIECES</text><text x="652" y="173" font-size="15">Masks, text and video fit together.</text><rect x="32" y="228" width="440" height="109" rx="13" fill="white"/><text x="48" y="257" font-size="19" font-weight="700">Tracking: stay on the sign</text><circle cx="55" cy="287" r="5" fill="#257350"/><text x="67" y="292" font-size="15">2 worked</text><circle cx="195" cy="287" r="5" fill="#8b5b0b"/><text x="207" y="292" font-size="15">1 partial</text><circle cx="335" cy="287" r="5" fill="#af3d47"/><text x="347" y="292" font-size="15">2 missed</text><text x="48" y="319" font-size="14" fill="#536276">A sticker must stay on its sign.</text><rect x="485" y="228" width="440" height="109" rx="13" fill="white"/><text x="501" y="257" font-size="19" font-weight="700">Layers: keep hands in front</text><circle cx="508" cy="287" r="5" fill="#257350"/><text x="520" y="292" font-size="15">3 worked</text><circle cx="648" cy="287" r="5" fill="#8b5b0b"/><text x="660" y="292" font-size="15">0 partial</text><circle cx="788" cy="287" r="5" fill="#af3d47"/><text x="800" y="292" font-size="15">2 missed</text><text x="501" y="319" font-size="14" fill="#536276">A hand should hide what is behind it.</text><rect x="32" y="351" width="440" height="109" rx="13" fill="white"/><text x="48" y="380" font-size="19" font-weight="700">Masks: keep the hair</text><circle cx="55" cy="410" r="5" fill="#257350"/><text x="67" y="415" font-size="15">0 worked</text><circle cx="195" cy="410" r="5" fill="#8b5b0b"/><text x="207" y="415" font-size="15">4 partial</text><circle cx="335" cy="410" r="5" fill="#af3d47"/><text x="347" y="415" font-size="15">1 missed</text><text x="48" y="442" font-size="14" fill="#536276">A cut-out edge needs more than scissors.</text><rect x="485" y="351" width="440" height="109" rx="13" fill="white"/><text x="501" y="380" font-size="19" font-weight="700">Lighting: match the room</text><circle cx="508" cy="410" r="5" fill="#257350"/><text x="520" y="415" font-size="15">0 worked</text><circle cx="648" cy="410" r="5" fill="#8b5b0b"/><text x="660" y="415" font-size="15">5 partial</text><circle cx="788" cy="410" r="5" fill="#af3d47"/><text x="800" y="415" font-size="15">2 missed</text><text x="501" y="442" font-size="14" fill="#536276">A lamp must light the object, not just glow.</text><rect x="32" y="474" width="440" height="109" rx="13" fill="white"/><text x="48" y="503" font-size="19" font-weight="700">Products: shape and material</text><circle cx="55" cy="533" r="5" fill="#257350"/><text x="67" y="538" font-size="15">2 worked</text><circle cx="195" cy="533" r="5" fill="#8b5b0b"/><text x="207" y="538" font-size="15">6 partial</text><circle cx="335" cy="533" r="5" fill="#af3d47"/><text x="347" y="538" font-size="15">1 missed</text><text x="48" y="565" font-size="14" fill="#536276">Correct shape matters as much as pretty light.</text><rect x="485" y="474" width="440" height="109" rx="13" fill="white"/><text x="501" y="503" font-size="19" font-weight="700">Actors: share the same action</text><circle cx="508" cy="533" r="5" fill="#257350"/><text x="520" y="538" font-size="15">2 worked</text><circle cx="648" cy="533" r="5" fill="#8b5b0b"/><text x="660" y="538" font-size="15">3 partial</text><circle cx="788" cy="533" r="5" fill="#af3d47"/><text x="800" y="538" font-size="15">0 missed</text><text x="501" y="565" font-size="14" fill="#536276">Bodies must agree about the same action.</text><rect x="32" y="597" width="440" height="109" rx="13" fill="white"/><text x="48" y="626" font-size="19" font-weight="700">Stories: build a talking cast</text><circle cx="55" cy="656" r="5" fill="#257350"/><text x="67" y="661" font-size="15">0 worked</text><circle cx="195" cy="656" r="5" fill="#8b5b0b"/><text x="207" y="661" font-size="15">2 partial</text><circle cx="335" cy="656" r="5" fill="#af3d47"/><text x="347" y="661" font-size="15">0 missed</text><text x="48" y="688" font-size="14" fill="#536276">Build the stage, actors and their moves.</text><rect x="485" y="597" width="440" height="109" rx="13" fill="white"/><text x="501" y="626" font-size="19" font-weight="700">Workflow: save the recipe</text><circle cx="508" cy="656" r="5" fill="#257350"/><text x="520" y="661" font-size="15">3 worked</text><circle cx="648" cy="656" r="5" fill="#8b5b0b"/><text x="660" y="661" font-size="15">0 partial</text><circle cx="788" cy="656" r="5" fill="#af3d47"/><text x="800" y="661" font-size="15">0 missed</text><text x="501" y="688" font-size="14" fill="#536276">Save the recipe, not only the movie.</text><text x="32" y="755" font-size="20" font-weight="700">Choose by the shot, not just the style.</text><text x="32" y="787" font-size="17">A realistic product can be code. A fantasy action can be generated.</text><text x="32" y="817" font-size="17">A mask fixes the edge. It cannot teach a hand to hold something.</text><text x="32" y="854" font-size="15">Worked = only the stated test passed. Partial = more work. Missed = failed this goal.</text><text x="32" y="882" font-size="15">Not yet proven: other story styles, long episodes, camera solve, reconstructed worlds.</text></g></svg>