<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EditableFrame / Clip studio</title><style>*{box-sizing:border-box}body{margin:0;background:#101922;color:#e7f0e9;font:14px system-ui}header{padding:22px 28px;border-bottom:1px solid #2a3a43}a{color:#b9ef78}main{display:grid;grid-template-columns:210px 1fr 260px;min-height:90vh}aside,section{padding:22px}aside{border-right:1px solid #2a3a43}h1{font-size:30px}h3{font-size:13px;margin-top:25px}button,input,select,textarea{font:inherit;border-radius:7px;border:1px solid #42555e;background:#1e303a;color:#ecf3ec;padding:8px}button{cursor:pointer}button:disabled{opacity:.3}#clips button{display:block;width:100%;text-align:left;margin-bottom:9px}#screen{width:100%;aspect-ratio:16/9;border-radius:14px;background:repeating-conic-gradient(#253641 0% 25%,#192831 0% 50%) 0 / 20px 20px}.transport,.actions{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}#seek{flex:1}label{display:block;margin:18px 0;font-size:12px}label input,label select{display:block;width:100%;margin-top:8px;accent-color:#b9ef78}input[type=color]{height:35px}#history{white-space:pre-line;font-size:12px;color:#8da59f}#status{font-size:11px;color:#96aba3;overflow-wrap:anywhere}textarea{width:100%;height:140px;margin:12px 0}summary{cursor:pointer}@media(max-width:900px){main{display:block}#clips{display:flex;overflow:auto}#clips button{min-width:160px}}</style><header><a href="/">EDITABLEFRAME</a> / Code the motion. Keep the control.</header><main><aside id="clips"></aside><section><h1 id="title"></h1><canvas id="screen"></canvas><div class="transport"><button id="play">Play</button><input id="seek" aria-label="Time" type="range" step="0.01" value="0"></div><div class="actions"><button id="undo">Undo</button><button id="redo">Redo</button><button id="save">Save project</button><label>Open <input id="open" type="file" accept=".json"></label><button id="reload">Reload disk</button><label><input id="timeline" type="checkbox"> Whole timeline</label><button id="context">LLM edit context</button></div><div id="status"></div><details><summary>Apply an agent edit</summary><p>Paste a proposal with baseRevision and command. Changes share the same history as the controls.</p><textarea id="proposal" aria-label="Edit proposal"></textarea><button id="apply">Apply proposal</button></details><pre id="history"></pre></section><aside id="controls"></aside></main><script type="module" src="bundle.js"></script></html>
